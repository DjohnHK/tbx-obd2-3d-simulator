let activeRefs = new Set();
const tb = document.getElementById('tb');
D.rows.forEach((r, idx) => {
  const tr = document.createElement('tr');
  tr.className = 'row';
  tr.onclick = () => {
    document.querySelectorAll('tr.row').forEach(x => x.classList.remove('sel'));
    tr.classList.add('sel');
    activeRefs = new Set(r.refs);
    document.getElementById('sel_info').innerText = `${r.refs.join(', ')} — ${r.brand} ${r.model} (${r.lcsc}) | Estoque JLCPCB: ${r.stock.toLocaleString()} un | US$ ${r.price.toFixed(4)}`;
    draw();
  };
  tr.innerHTML = `<td><b>${r.qty}</b></td><td style="font-family:Consolas;color:#fde047">${r.refs.join(', ')}</td><td>${r.val}</td><td style="font-family:Consolas;color:#7dd3fc">${r.lcsc}</td><td><span class="${r.tier==='Basic'?'tag-b':'tag-e'}">${r.tier}</span></td><td style="font-family:Consolas;color:#34d399">${r.stock.toLocaleString()}</td>`;
  tb.appendChild(tr);
});

function draw() {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const sc = 9.4, ox = 36, oy = 548;
  const tx = x => ox + x*sc, ty = y => oy - y*sc;
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2;
  [D.outer, D.tab].forEach(poly => {
    ctx.beginPath(); poly.forEach((p,i)=>i===0?ctx.moveTo(tx(p[0]),ty(p[1])):ctx.lineTo(tx(p[0]),ty(p[1]))); ctx.stroke();
  });
  D.pads.forEach(p => {
    const hi = activeRefs.has(p.ref);
    ctx.fillStyle = hi ? '#ef233c' : 'rgba(148,163,184,0.32)';
    ctx.fillRect(tx(p.x-p.w/2), ty(p.y+p.h/2), p.w*sc, p.h*sc);
  });
  D.rows.forEach(r => r.placements.forEach(c => {
    const hi = activeRefs.has(c.ref);
    const w = (c.rot===90||c.rot===270)?c.w:c.l, h = (c.rot===90||c.rot===270)?c.l:c.w;
    ctx.strokeStyle = hi ? '#00f2fe' : 'rgba(56,189,248,0.28)';
    ctx.lineWidth = hi ? 2.5 : 1;
    ctx.strokeRect(tx(c.x-w/2), ty(c.y+h/2), w*sc, h*sc);
    if (hi) {
      ctx.fillStyle = 'rgba(0,242,254,0.22)';
      ctx.fillRect(tx(c.x-w/2), ty(c.y+h/2), w*sc, h*sc);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Consolas';
      ctx.fillText(c.ref, tx(c.x)-10, ty(c.y)+4);
    }
  }));
}
draw();
